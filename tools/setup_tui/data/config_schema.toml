# tools/setup_tui/data/config_schema.toml -- the --from-config/--initial-config closed
# schema (ADR-0012 P10). Loaded by tools/setup_tui/config_file.py.

header_keys = ["config_format", "produced_by", "source"]

# deploy-feature-manifest (ledger row 1274/1322): the wizard's own --from-config/--initial-config
# mirror of the SEPARATE features.json manifest new-project.sh itself reads (tools/setup_tui/
# steps_features.py's own module docstring explains why the two files are not the same file).
[[key]]
path = "features.portable_adrs"
type = "bool"

[[key]]
path = "features.vendored_skills"
type = "bool"

[[key]]
